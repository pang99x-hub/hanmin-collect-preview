<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1f5fbf" />
    <title>한민고 AX 학사운영 시스템 · 연결 대기</title>
    <style>
      :root { font-family: Pretendard, system-ui, sans-serif; color: #172033; background: #f5f7fa; }
      body { min-height: 100vh; min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { width: min(100%, 420px); border: 1px solid #d7dde8; background: #fff; padding: 28px; box-sizing: border-box; }
      h1 { margin: 0; font-size: 20px; letter-spacing: 0; }
      p { margin: 12px 0 0; color: #5d687a; font-size: 14px; line-height: 1.65; }
      button { margin-top: 22px; border: 0; background: #1f5fbf; color: #fff; padding: 10px 16px; font: inherit; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>네트워크 연결을 기다리고 있습니다</h1>
      <p>연결이 복구되면 로그인 상태와 최신 운영 데이터를 다시 확인합니다.</p>
      <button type="button" onclick="location.reload()">다시 연결</button>
    </main>
  </body>
</html>
